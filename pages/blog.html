<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Jeet Vyas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Header & Navigation Bar -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="../index.html" class="site-title">Jeet Vyas</a>

      <div class="header-actions">
        <nav id="main-nav">
          <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>

        <button type="button" class="theme-btn" id="theme-toggle">Dark</button>
        <button type="button" class="menu-btn" id="mobile-menu-btn">Menu</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">

    <!-- Page Title -->
    <section class="page-intro">
      <h1>My Learning Notes</h1>
      <p>A collection of simple notes I write while learning web development.</p>
    </section>

    <!-- Add Note Form -->
    <section class="form-panel">
      <h2>Add a New Note</h2>
      <div id="post-success-notice" class="notice">Note saved successfully!</div>

      <form id="new-post-form">
        <div class="form-group">
          <label for="post-title">Note Title</label>
          <input type="text" id="post-title" placeholder="e.g. JavaScript Arrays" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="post-date">Date</label>
            <input type="date" id="post-date" required>
          </div>

          <div class="form-group">
            <label for="post-tag">Category</label>
            <select id="post-tag">
              <option value="Web Dev">Web Dev</option>
              <option value="DSA">DSA</option>
              <option value="UI/UX">UI/UX</option>
              <option value="Notes">Notes</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="post-content">Note Content</label>
          <textarea id="post-content" placeholder="Write what you learned today..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Note</button>
      </form>
    </section>

    <!-- Filter & Search Section -->
    <section class="content-section">
      <div class="section-header">
        <h2>All Notes</h2>
        <input type="text" id="search-posts" placeholder="Search notes..." class="search-input">
      </div>

      <!-- Category Filter Buttons -->
      <div class="skills-wrap">
        <button type="button" class="category-filter-btn active" data-category="all">All</button>
        <button type="button" class="category-filter-btn" data-category="Web Dev">Web Dev</button>
        <button type="button" class="category-filter-btn" data-category="DSA">DSA</button>
        <button type="button" class="category-filter-btn" data-category="UI/UX">UI/UX</button>
        <button type="button" class="category-filter-btn" data-category="Notes">Notes</button>
      </div>

      <!-- Container where JavaScript loads the notes -->
      <div class="blog-list" id="blog-posts-container">
        <!-- Notes are rendered here by JavaScript -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <ul class="footer-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <p>Built by Jeet Vyas</p>
    </div>
  </footer>

  <!-- Link to JavaScript file -->
  <script src="../js/script.js"></script>
</body>
</html>
